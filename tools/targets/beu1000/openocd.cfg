# BE-U1000 on EVU-BA-2.5 through the on-board FT2232H, to set up the tracer over SBA.
# Scripts come from Baikal MCU SDK 2.3.0 (run with -s <SDK>/Tools/OpenOCD/share/openocd/scripts).
# Unlike board/baikal/EVU_BA_2_5.cfg: the core is not halted (trace comes from a running core), own ports,
# and the adapter can be selected by USB bus location (BEU_USB=1-1).

source [find target/baikal/BE_U1000/registers.cfg]
source [find interface/baikal/evu-ba_ftdi.cfg]
if {[info exists ::env(BEU_USB)]} {
	adapter usb location $::env(BEU_USB)
}

debug_level 1
gdb port 3337
telnet port 4446
tcl port 6668

source [find target/baikal/common/taps.cfg]
source [find target/baikal/common/include.cfg]

targets CORE_0
# otherwise read_memory on a running core touches core registers (priv) and fails; SBA works anyway
riscv virt2phys_mode off
# the SDK's taps.cfg applied set_mem_access to the last target created (CORE_2)
riscv set_mem_access sysbus
init
